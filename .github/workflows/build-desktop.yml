name: Build desktop

on:
  push:
    branches:
      - feature/desktop-platforms
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  windows:
    name: Build Windows
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release bundle
        run: flutter build windows --release --no-pub

      - name: Create ZIP
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "build/windows/x64/runner/Release/*"
          -DestinationPath "Plana-Windows-x64.zip"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: Plana-Windows-x64
          path: Plana-Windows-x64.zip
          if-no-files-found: error

  macos:
    name: Build macOS
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release app
        run: flutter build macos --release --no-pub

      - name: Create unsigned DMG
        run: >-
          hdiutil create
          -volname "Plana App"
          -srcfolder "build/macos/Build/Products/Release/Plana App.app"
          -ov
          -format UDZO
          "Plana-macOS.dmg"

      - name: Upload macOS image
        uses: actions/upload-artifact@v4
        with:
          name: Plana-macOS
          path: Plana-macOS.dmg
          if-no-files-found: error
